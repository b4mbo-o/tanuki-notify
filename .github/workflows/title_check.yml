name: Thread Title Watcher

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_for_updates:
    runs-on: ubuntu-latest
    environment: .env

    steps:
      # ブランチ存在チェック → BRANCH_NAME に格納
      - name: Detect branch (actions or main)
        id: detect_branch
        run: |
          if git ls-remote --exit-code origin actions &>/dev/null; then
            echo "actions branch found"
            echo "BRANCH_NAME=actions" >> $GITHUB_ENV
          else
            echo "actions branch NOT found, using main"
            echo "BRANCH_NAME=main" >> $GITHUB_ENV
          fi

      # 1. 動的に決まったブランチを checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Python セットアップ
      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      # 3. 依存関係インストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. スクリプト実行
      - name: Run watcher script
        env:
          TW_CONSUMER_KEY: ${{ secrets.TW_CONSUMER_KEY }}
          TW_CONSUMER_SECRET: ${{ secrets.TW_CONSUMER_SECRET }}
          TW_ACCESS_TOKEN: ${{ secrets.TW_ACCESS_TOKEN }}
          TW_ACCESS_SECRET: ${{ secrets.TW_ACCESS_SECRET }}
        run: python main.py

      # 5. 状態ファイルをコミット & プッシュ（checkoutしたブランチへ）
      - name: Commit and push state file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"

          git add last_seen_urls.json

          git diff --quiet --staged || git commit -m "Update last seen thread URLs [skip ci]"

          # 動的に決めたブランチへ push
          git push origin $BRANCH_NAME
