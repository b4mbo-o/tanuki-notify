name: Thread Title Watcher

on:
  schedule:
    # 20分に1回実行
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_for_updates:
    runs-on: ubuntu-latest
    environment: .env

    steps:
      # 1. actions ブランチのコードをチェックアウト
      - name: Checkout repository (actions branch code)
        uses: actions/checkout@v4
        with:
          ref: actions
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Python 環境セットアップ
      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      # 3. 必要なライブラリをインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. スクリプト実行
      - name: Run watcher script
        env:
          TW_CONSUMER_KEY: ${{ secrets.TW_CONSUMER_KEY }}
          TW_CONSUMER_SECRET: ${{ secrets.TW_CONSUMER_SECRET }}
          TW_ACCESS_TOKEN: ${{ secrets.TW_ACCESS_TOKEN }}
          TW_ACCESS_SECRET: ${{ secrets.TW_ACCESS_SECRET }}
        run: python main.py

      # 5. 状態ファイルコミット
      - name: Commit and push state file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"

          git add last_seen_urls.json

          # 変更があるときだけ commit
          git diff --quiet --staged || git commit -m "Update last seen thread URLs [skip ci]"

          # actions ブランチに push
          git push origin actions
