name: Thread Title Watcher

on:
  schedule:
    # 20分間に1回実行 (cron: '分 時 日 月 曜日')
    - cron: "*/20 * * * *" 
  workflow_dispatch: # 手動実行を可能にする

# 🚨 必須: Botにリポジトリへの書き込み権限を与える
permissions:
  contents: write

jobs:
  check_for_updates:
    runs-on: ubuntu-latest
    environment: .env
    
    steps:
      - name: Checkout repository (actions branch code)
        uses: actions/checkout@v4
        with:
          # 🚨 修正点: actionsブランチのコードを取得するよう指定
          ref: actions 
          token: ${{ secrets.GITHUB_TOKEN }} # トークンも忘れずに渡す

      # 2. Python環境のセットアップ
      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          # キャッシュを有効にし、依存関係のインストールを高速化
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # 3. 依存関係のインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Botの実行
      - name: Run watcher script
        env:
          # Secretを環境変数として渡す
          TW_CONSUMER_KEY: ${{ secrets.TW_CONSUMER_KEY }}
          TW_CONSUMER_SECRET: ${{ secrets.TW_CONSUMER_SECRET }}
          TW_ACCESS_TOKEN: ${{ secrets.TW_ACCESS_TOKEN }}
          TW_ACCESS_SECRET: ${{ secrets.TW_ACCESS_SECRET }}
        run: python main.py
      
      # 5. 状態ファイルを 'actions' ブランチにコミットして保存
      - name: Commit and push state file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add last_seen_urls.json
          # 変更がなければコミットしない
          git diff --quiet --staged || git commit -m "Update last seen thread URLs [skip ci]"
          # 🚨 'actions' ブランチにプッシュ
          git push origin actions
