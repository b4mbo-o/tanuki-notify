name: Thread Title Watcher

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_for_updates:
    runs-on: ubuntu-latest
    environment: .env

    steps:
      # 📌 まずは shallow clone（デフォのmain）だけ checkout して .git を作る
      - name: Initial checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 📌 ブランチ存在チェック → BRANCH_NAME に格納
      - name: Detect branch (actions or main)
        id: detect_branch
        run: |
          # remote を強制再設定（安全のため）
          git remote remove origin || true
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          # actions ブランチが存在するか確認
          if git ls-remote --heads origin actions | grep actions >/dev/null; then
            echo "actions branch found"
            echo "BRANCH_NAME=actions" >> $GITHUB_ENV
          else
            echo "actions branch NOT found, falling back to main"
            echo "BRANCH_NAME=main" >> $GITHUB_ENV
          fi

      # 📌 選ばれたブランチを改めて checkout し直す
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---- ここからいつもの処理 ----

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run watcher script
        env:
          SEARCH_KEYWORD: ${{ secrets.SEARCH_KEYWORD }}
          TW_CONSUMER_KEY: ${{ secrets.TW_CONSUMER_KEY }}
          TW_CONSUMER_SECRET: ${{ secrets.TW_CONSUMER_SECRET }}
          TW_ACCESS_TOKEN: ${{ secrets.TW_ACCESS_TOKEN }}
          TW_ACCESS_SECRET: ${{ secrets.TW_ACCESS_SECRET }}
        run: python main.py

      - name: Commit and push state file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"

          git add last_seen_urls.json

          git diff --quiet --staged || git commit -m "Update last seen thread URLs [skip ci]"

          git push origin $BRANCH_NAME
